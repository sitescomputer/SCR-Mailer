name: SCR Mailer release
on:
  push:
    tags: ['v*-scr.*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Yarn
        run: corepack enable
      - name: Test backend
        run: go test ./...
      - name: Release branded binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --parallelism 1 --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYPRESS_INSTALL_BINARY: '0'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SCR Mailer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.build
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SCR_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/sitescomputer/scr-mailer:${{ github.ref_name }}
            ghcr.io/sitescomputer/scr-mailer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
